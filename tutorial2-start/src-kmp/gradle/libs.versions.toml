[versions]
# The Kotlin compiler this repo builds with.
kotlin = "2.4.10"
# The Duet release the Kotlin modules resolve from the family's Maven host
# (settings.gradle.kts).
duet = "0.7.0"
# The shared-services release (telemetry, theming) from the same host.
duetServices = "0.11.1"
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.11.0"
# The family's mock engine: `<Name>Mock` recording spies generated into
# jvmTest at test compilation; nothing committed.
mocksProcessor = "0.2.1"
# KSP 2.x versions independently of the Kotlin compiler.
ksp = "2.3.11"

[libraries]
duet-kernel = { module = "dev.modaal.duet:kernel", version.ref = "duet" }
duet-kernel-test = { module = "dev.modaal.duet:kernel-test", version.ref = "duet" }
duet-services-telemetry = { module = "dev.modaal.duet.services:telemetry", version.ref = "duetServices" }
duet-services-theming = { module = "dev.modaal.duet.services:theming", version.ref = "duetServices" }
mocks-processor = { module = "dev.modaal:mocks-processor", version.ref = "mocksProcessor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
