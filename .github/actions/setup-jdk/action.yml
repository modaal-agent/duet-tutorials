# The JDK every lane builds with, from the runner image when it carries one and
# from the Actions cache when it does not.
#
# The ubuntu image ships a Java 25, so the android lane resolves it locally and
# never reaches the network. The macOS image does not, so actions/setup-java
# resolves it from the Temurin release host and downloads a few hundred MB on
# every macos job. The tree matrix is around thirty jobs, so an HTTP 500 from
# that host is routine, and it fails the lane it hits:
#
#   Downloading Java 25.0.4+101.0.LTS (Temurin-Hotspot) from https://github.com/…
#   Unexpected HTTP response: 500
#   ##[error]HTTP 500: Unexpected HTTP response: 500
#
# So the tool cache entry is cached, but only on a runner whose image does not
# already carry the version. The probe runs before the restore, so it reports
# what the bare image has: a future macOS image that ships Java 25 drops the
# cache on its own, and an ubuntu image that stops shipping it picks the cache
# up, with no edit here.
#
# The cache holds a patch version, not a range, so `java-version: "25"` keeps
# resolving to the patch first stored under that key. Bump `JDK` in `pins.env`
# to move it, or delete the entry under the repository's Actions caches.
name: Set up the JDK
description: Install the pinned Temurin JDK, caching it only on runners whose image lacks it.

inputs:
  java-version:
    description: >
      Temurin major version. Passed in from the workflow rather than defaulted
      here, because scripts/check-pins.sh reads `java-version:` out of
      .github/workflows/*.yml and holds it to pins.env's JDK.
    required: true

runs:
  using: composite
  steps:
    # The directory is Java_Temurin-Hotspot_jdk, which a case-sensitive
    # filesystem does not match case-insensitively; the glob spares the casing
    # and the resolved patch, which is not known until setup-java runs.
    - name: Does the image carry the JDK?
      id: image
      shell: bash
      run: |
        if compgen -G "$RUNNER_TOOL_CACHE/Java_*_jdk/${{ inputs.java-version }}.*" >/dev/null; then
          echo "carries=true" >> "$GITHUB_OUTPUT"
        else
          echo "carries=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Restore the JDK
      id: cached
      if: steps.image.outputs.carries == 'false'
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.tool_cache }}/Java_*_jdk/${{ inputs.java-version }}.*
        key: jdk-temurin-${{ inputs.java-version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Install the JDK
      id: install
      uses: actions/setup-java@v6
      continue-on-error: true
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    # setup-java retries twice on its own, 10 and 16 seconds apart, and the
    # outages that fail a lane outlast that. The second attempt waits a minute
    # and brings its own two retries; a version that genuinely does not exist
    # still fails both, with the same error.
    - name: Wait out the download failure
      if: steps.install.outcome == 'failure'
      shell: bash
      run: sleep 60

    - name: Install the JDK, second attempt
      if: steps.install.outcome == 'failure'
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    # Saved as its own step rather than on job teardown, so a lane that goes
    # red after this point still leaves the next run warm. Parallel jobs racing
    # the same key is expected: the first wins and the rest log a warning.
    - name: Save the JDK
      if: steps.image.outputs.carries == 'false' && steps.cached.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.tool_cache }}/Java_*_jdk/${{ inputs.java-version }}.*
        key: jdk-temurin-${{ inputs.java-version }}-${{ runner.os }}-${{ runner.arch }}
