# The feature-parity manifest. Every feature declares its one commonMain
# implementation, the scenario its fixtures are compiled from (fixtures are
# build products of `tools/duet record` — never edited by hand), and the
# fixtures that pin its behavior. The `duet` CLI is this file's only parser
# (grammar: the toolchain's contracts/manifest.md); unknown top-level keys are
# an error, and the indentation shape is part of the grammar.

features:
  splash:
    kotlin: src-kmp/subtrees/splash/logic/src/commonMain/kotlin/dev/modaal/foyer/splash/SplashFeature.kt
    state: SplashState
    action: SplashAction
    effectPayload: SplashEffectPayload
    scenario: src-kmp/subtrees/splash/logic/src/jvmTest/kotlin/dev/modaal/foyer/splash/SplashScenarioTest.kt
    fixtures:
      - splash.ceremony-completes
      - splash.safety-net-fires
      - splash.both-paths-notify-twice
      - splash.repeat-appear-inert

  root:
    kotlin: src-kmp/subtrees/root/logic/src/commonMain/kotlin/dev/modaal/foyer/root/RootFeature.kt
    state: RootState
    action: RootAction
    effectPayload: RootEffectPayload
    scenario: src-kmp/subtrees/root/logic/src/jvmTest/kotlin/dev/modaal/foyer/root/RootScenarioTest.kt
    fixtures:
      - root.splash-before-auth-holds
      - root.gate-after-splash
      - root.late-splash-inert
      - root.late-sign-in-inert
      - root.signed-in-skips-gate
      - root.gate-picks-onboarding
      - root.onboarding-completes-into-main
      - root.sign-out-returns-to-gate
      - root.session-expiry-returns-to-gate
      - root.entitlement-changes
      - root.link-forwards-under-main
      - root.link-waits-for-main
  signin:
    kotlin: src-kmp/subtrees/signin/logic/src/commonMain/kotlin/dev/modaal/foyer/signin/SignInFeature.kt
    state: SignInState
    action: SignInAction
    effectPayload: SignInEffectPayload
    scenario: src-kmp/subtrees/signin/logic/src/jvmTest/kotlin/dev/modaal/foyer/signin/SignInScenarioTest.kt
    fixtures:
      - signin.email-signs-in
      - signin.guest-signs-in
      - signin.empty-address-fails
      - signin.port-failure-lands
  main:
    kotlin: src-kmp/subtrees/main/logic/src/commonMain/kotlin/dev/modaal/foyer/main/MainFeature.kt
    state: MainState
    action: MainAction
    effectPayload: MainEffectPayload
    scenario: src-kmp/subtrees/main/logic/src/jvmTest/kotlin/dev/modaal/foyer/main/MainScenarioTest.kt
    fixtures:
      - main.tab-switches
      - main.sign-out-relays
      - main.home-opens-the-upgrade-flow
      - main.profile-opens-the-upgrade-flow
      - main.link-opens-the-upgrade-flow
      - main.link-travels-to-the-profile-tab
  home:
    kotlin: src-kmp/subtrees/home/logic/src/commonMain/kotlin/dev/modaal/foyer/home/HomeFeature.kt
    state: HomeState
    action: HomeAction
    effectPayload: HomeEffectPayload
    scenario: src-kmp/subtrees/home/logic/src/jvmTest/kotlin/dev/modaal/foyer/home/HomeScenarioTest.kt
    fixtures:
      - home.loads-once
      - home.reappear-keeps-items
      - home.locked-card-presents-promo
      - home.unlocked-card-presents-insights
      - home.promo-requests-the-upgrade
      - home.card-unlocks-from-the-stream
  profile:
    kotlin: src-kmp/subtrees/profile/logic/src/commonMain/kotlin/dev/modaal/foyer/profile/ProfileFeature.kt
    state: ProfileState
    action: ProfileAction
    effectPayload: ProfileEffectPayload
    scenario: src-kmp/subtrees/profile/logic/src/jvmTest/kotlin/dev/modaal/foyer/profile/ProfileScenarioTest.kt
    fixtures:
