  name:
    kotlin: src-kmp/subtrees/name/logic/src/commonMain/kotlin/dev/modaal/foyer/name/NameFeature.kt
    state: NameState
    action: NameAction
    effectPayload: NameEffectPayload
    scenario: src-kmp/subtrees/name/logic/src/jvmTest/kotlin/dev/modaal/foyer/name/NameScenarioTest.kt
    fixtures:
