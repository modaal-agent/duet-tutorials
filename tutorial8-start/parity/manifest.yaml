# Chain fixtures pin a composition seam across features: the delegate event
# one feature emits, received as the next feature's action. Owned by no
# single feature; the test that records each one lives in the module of the
# chain's last node.
chains:
  - chain-root-splash
  - chain-root-signin
  - chain-main-signout
  - chain-profile-editname
  - chain-root-onboarding
  - chain-onboarding-name
  - chain-upgrade-entitlement

presentation:
  waivers: []
  islands: []

# Generated Swift code, `tools/duet mocks`. One row per generated file; the
# bundle tag pins the swift-sourcery-templates release that carries the engine,
# the templates and the mock-templates CLI together. Regeneration is
# `tools/duet mocks`; the CI gate is `tools/duet mocks --check`, which
# validates each file's fingerprint block without running the engine. Files
# under Generated/ are build products: change the protocol and regenerate,
# never hand-edit. Two rows per shell target: the level's Component, generated
# from its `DuetComponent`-annotated Dependency into the target, and the
# Dependency's test double, generated from `CreateMock` into the test target.
# Kotlin-side test doubles are the KSP processor's, wired per module in
# Gradle, and take no rows here.
mocks:
  bundle: 0.6.2
  generators:
    signin_components:
      output: src-ios/Libraries/FoyerKit/Sources/SignInShell/Generated/SignInShellComponents.swift
      template: Component.swifttemplate
      sources:
        - src-ios/Libraries/FoyerKit/Sources/SignInShell
      args:
        - import=FoyerKit
    signin_mocks:
      output: src-ios/Libraries/FoyerKit/Tests/SignInShellTests/Generated/SignInShellMocks.swift
      template: Mocks.swifttemplate
      sources:
        - src-ios/Libraries/FoyerKit/Sources/SignInShell
      args:
        - import=SignInShell
        - import=FoyerKit
    home_components:
      output: src-ios/Libraries/FoyerKit/Sources/HomeShell/Generated/HomeShellComponents.swift
