  progress:
    kotlin: src-kmp/subtrees/progress/logic/src/commonMain/kotlin/dev/modaal/foyer/progress/ProgressFeature.kt
    state: ProgressState
    action: ProgressAction
    effectPayload: ProgressEffectPayload
    scenario: src-kmp/subtrees/progress/logic/src/jvmTest/kotlin/dev/modaal/foyer/progress/ProgressScenarioTest.kt
    fixtures:
